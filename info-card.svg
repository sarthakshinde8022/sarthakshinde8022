<svg xmlns="http://www.w3.org/2000/svg" width="560" height="402" viewBox="0 0 560 402" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">About Sarthak</title>
  <style>
    .mono{font-family:'Cascadia Code','SF Mono',Consolas,'Liberation Mono',monospace}
    .sans{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
    .k{font-size:13px;fill:#e0a15a}
    .v{font-size:14.5px;fill:#dde5ee}
    .row{animation:in .5s ease both}
    @keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
    .led{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.3}}
    @media (prefers-reduced-motion:reduce){.row,.led{animation:none}}
  </style>

  <rect x="0.5" y="0.5" width="559" height="401" rx="14" fill="#0d1421" stroke="#1d2a3d"/>

  <circle class="led" cx="28" cy="28" r="4.5" fill="#3ddc84"/>
  <text class="mono" x="44" y="33" font-size="14" fill="#8fa3bf">sarthak.spec</text>
  <line x1="0" y1="56" x2="560" y2="56" stroke="#1d2a3d"/>

  <g stroke="#1d2a3d">
    <line x1="28" y1="94" x2="532" y2="94"/>
    <line x1="28" y1="132" x2="532" y2="132"/>
    <line x1="28" y1="170" x2="532" y2="170"/>
    <line x1="28" y1="208" x2="532" y2="208"/>
    <line x1="28" y1="246" x2="532" y2="246"/>
    <line x1="28" y1="284" x2="532" y2="284"/>
    <line x1="28" y1="322" x2="532" y2="322"/>
    <line x1="28" y1="360" x2="532" y2="360"/>
  </g>

  <g class="row" style="animation-delay:.1s">
    <text class="k mono" x="28" y="80">role</text>
    <text class="v sans" x="150" y="80">B.Tech ECE (AI/ML) student</text>
  </g>
  <g class="row" style="animation-delay:.3s">
    <text class="k mono" x="28" y="118">school</text>
    <text class="v sans" x="150" y="118">DES Pune University</text>
  </g>
  <g class="row" style="animation-delay:.5s">
    <text class="k mono" x="28" y="156">city</text>
    <text class="v sans" x="150" y="156">Pune, India</text>
  </g>
  <g class="row" style="animation-delay:.7s">
    <text class="k mono" x="28" y="194">studying</text>
    <text class="v sans" x="150" y="194">Digital Image Processing (PDIP)</text>
  </g>
  <g class="row" style="animation-delay:.9s">
    <text class="k mono" x="28" y="232">stack</text>
    <text class="v sans" x="150" y="232">Python, Embedded C, MySQL, Streamlit</text>
  </g>
  <g class="row" style="animation-delay:1.1s">
    <text class="k mono" x="28" y="270">hardware</text>
    <text class="v sans" x="150" y="270">STM32, ESP32</text>
  </g>
  <g class="row" style="animation-delay:1.3s">
    <text class="k mono" x="28" y="308">building</text>
    <text class="v sans" x="150" y="308" font-size="14">ECO-EYE, JayBot, Fleet Logbook, Derain Dehazing</text>
  </g>
  <g class="row" style="animation-delay:1.5s">
    <text class="k mono" x="28" y="346">side quest</text>
    <text class="v sans" x="150" y="346">Art3mis, CODM content in Hindi-English</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata>  <g class="row" style="animation-delay:1.7s">
    <text class="k mono" x="28" y="384">learning</text>
    <text class="v sans" x="150" y="384">Project Based Experiential Learning (PBEL)</text>
  </g>
</svg>
