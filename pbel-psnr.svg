<title id="t">PSNR of five filters at four Gaussian noise variances</title>
<desc id="d">Line chart. Wiener is best overall at 24.85 dB average. Bilateral is best at variance 0.005 with 28.41 dB but drops to 14.90 dB at variance 0.05. Gaussian is best at 0.05 with 21.51 dB.</desc>
