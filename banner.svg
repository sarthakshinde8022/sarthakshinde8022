<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Sarthak: embedded systems, machine learning and gaming content</title>
  <defs>
    <pattern id="vias" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#8fa3bf" fill-opacity="0.14"/>
    </pattern>
    <clipPath id="c"><rect width="1000" height="280" rx="14"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'Cascadia Code','SF Mono',Consolas,'Liberation Mono',monospace}
    .sans{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
    .tr{fill:none;stroke:#b4783c;stroke-opacity:.55;stroke-width:2;stroke-linejoin:round}
    .pl{fill:none;stroke:#ffd7a1;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 95;animation:run 3.2s linear infinite}
    @keyframes run{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
    .role{opacity:0;animation:role 9s infinite}
    .r2{animation-delay:3s}
    .r3{animation-delay:6s}
    @keyframes role{0%{opacity:0}5%{opacity:1}30%{opacity:1}35%{opacity:0}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .pl,.role{animation:none}
      .r1{opacity:1}
    }
  </style>

  <g clip-path="url(#c)">
    <rect width="1000" height="280" fill="#0a0f1c"/>
    <rect width="1000" height="280" fill="url(#vias)"/>

    <!-- traces: right of chip -->
    <path class="tr" d="M880 98 H915 L935 78 H1000"/>
    <path class="tr" d="M880 119 H960 L972 107 H1000"/>
    <path class="tr" d="M880 140 H1000"/>
    <path class="tr" d="M880 161 H960 L972 173 H1000"/>
    <path class="tr" d="M880 182 H915 L935 202 H1000"/>
    <!-- traces: left of chip -->
    <path class="tr" d="M760 98 H700 L680 78 H640"/>
    <path class="tr" d="M760 119 H720 L706 105 H640"/>
    <path class="tr" d="M760 140 H640"/>
    <path class="tr" d="M760 161 H720 L706 175 H640"/>
    <path class="tr" d="M760 182 H700 L680 202 H640"/>
    <!-- traces: top and bottom -->
    <path class="tr" d="M790 80 V46 L808 28 V0"/>
    <path class="tr" d="M820 80 V0"/>
    <path class="tr" d="M850 80 V46 L832 28 V0"/>
    <path class="tr" d="M790 200 V234 L808 252 V280"/>
    <path class="tr" d="M820 200 V280"/>
    <path class="tr" d="M850 200 V234 L832 252 V280"/>

    <!-- pads at the ends of the left traces -->
    <g fill="#0a0f1c" stroke="#b4783c" stroke-opacity=".7" stroke-width="2">
      <circle cx="640" cy="78" r="4"/>
      <circle cx="640" cy="105" r="4"/>
      <circle cx="640" cy="140" r="4"/>
      <circle cx="640" cy="175" r="4"/>
      <circle cx="640" cy="202" r="4"/>
    </g>

    <!-- signal pulses travelling away from the chip -->
    <path class="pl" pathLength="100" d="M880 98 H915 L935 78 H1000" style="animation-duration:2.8s"/>
    <path class="pl" pathLength="100" d="M880 119 H960 L972 107 H1000" style="animation-duration:3.6s;animation-delay:.6s"/>
    <path class="pl" pathLength="100" d="M880 140 H1000" style="animation-duration:2.4s;animation-delay:1.1s"/>
    <path class="pl" pathLength="100" d="M880 161 H960 L972 173 H1000" style="animation-duration:3.3s;animation-delay:.2s"/>
    <path class="pl" pathLength="100" d="M880 182 H915 L935 202 H1000" style="animation-duration:3s;animation-delay:1.5s"/>
    <path class="pl" pathLength="100" d="M760 98 H700 L680 78 H640" style="animation-duration:2.6s;animation-delay:.9s"/>
    <path class="pl" pathLength="100" d="M760 119 H720 L706 105 H640" style="animation-duration:3.2s"/>
    <path class="pl" pathLength="100" d="M760 140 H640" style="animation-duration:2.2s;animation-delay:1.3s"/>
    <path class="pl" pathLength="100" d="M760 161 H720 L706 175 H640" style="animation-duration:3.4s;animation-delay:.4s"/>
    <path class="pl" pathLength="100" d="M760 182 H700 L680 202 H640" style="animation-duration:2.9s;animation-delay:1.8s"/>
    <path class="pl" pathLength="100" d="M790 80 V46 L808 28 V0" style="animation-duration:2.5s;animation-delay:.3s"/>
    <path class="pl" pathLength="100" d="M820 80 V0" style="animation-duration:2.1s;animation-delay:1.2s"/>
    <path class="pl" pathLength="100" d="M850 80 V46 L832 28 V0" style="animation-duration:2.7s;animation-delay:.8s"/>
    <path class="pl" pathLength="100" d="M790 200 V234 L808 252 V280" style="animation-duration:2.9s;animation-delay:1.6s"/>
    <path class="pl" pathLength="100" d="M820 200 V280" style="animation-duration:2.3s;animation-delay:.5s"/>
    <path class="pl" pathLength="100" d="M850 200 V234 L832 252 V280" style="animation-duration:3.1s;animation-delay:1s"/>

    <!-- chip pins -->
    <g fill="#7f8da3">
      <rect x="785" y="72" width="10" height="8"/><rect x="815" y="72" width="10" height="8"/><rect x="845" y="72" width="10" height="8"/>
      <rect x="785" y="200" width="10" height="8"/><rect x="815" y="200" width="10" height="8"/><rect x="845" y="200" width="10" height="8"/>
      <rect x="752" y="94" width="8" height="8"/><rect x="752" y="115" width="8" height="8"/><rect x="752" y="136" width="8" height="8"/><rect x="752" y="157" width="8" height="8"/><rect x="752" y="178" width="8" height="8"/>
      <rect x="880" y="94" width="8" height="8"/><rect x="880" y="115" width="8" height="8"/><rect x="880" y="136" width="8" height="8"/><rect x="880" y="157" width="8" height="8"/><rect x="880" y="178" width="8" height="8"/>
    </g>

    <!-- chip -->
    <rect x="760" y="80" width="120" height="120" rx="6" fill="#121a2b" stroke="#3a4a63" stroke-width="1.5"/>
    <circle cx="774" cy="94" r="3" fill="#e0a15a"/>
    <text class="mono" x="820" y="136" text-anchor="middle" font-size="17" fill="#dbe4ee">sarthak</text>
    <text class="mono" x="820" y="158" text-anchor="middle" font-size="11" fill="#7d8da1">ece, ai/ml</text>

    <!-- silkscreen labels -->
    <g class="mono" font-size="10" fill="#8fa3bf" fill-opacity=".4">
      <text x="762" y="72">U1</text>
      <text x="888" y="90">R7</text>
      <text x="888" y="212">C3</text>
      <text x="652" y="70">R2</text>
      <text x="652" y="222">C1</text>
    </g>

    <!-- text -->
    <text class="mono" x="56" y="86" font-size="15" fill="#7d8da1">hello, I'm</text>
    <text class="sans" x="52" y="150" font-size="72" font-weight="700" letter-spacing="-1.5" fill="#eef3ee">Sarthak</text>

    <g class="mono" font-size="21" fill="#e0a15a">
      <text class="role r1" x="56" y="196">&gt; embedded systems</text>
      <text class="role r2" x="56" y="196">&gt; machine learning</text>
      <text class="role r3" x="56" y="196">&gt; gaming content as Art3mis</text>
    </g>

    <text class="sans" x="56" y="240" font-size="15" fill="#93a1b3">B.Tech ECE (AI/ML) student at DES Pune University in Pune, India.</text>
  </g>

  <rect x="0.5" y="0.5" width="999" height="279" rx="14" fill="none" stroke="#1d2a3d"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
